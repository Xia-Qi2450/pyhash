name: Build & Release

# Triggers on version tags, e.g.:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: checksum_tool-linux
          - os: windows-latest
            asset_name: checksum_tool-windows.exe
          - os: macos-latest
            asset_name: checksum_tool-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install tqdm halo pyinstaller

      - name: Run smoke test before packaging
        run: python tests/smoke_test.py

      - name: Build standalone executable
        run: pyinstaller --onefile --name checksum_tool checksum_tool.py

      - name: Rename artifact (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: mv dist/checksum_tool dist/${{ matrix.asset_name }}

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: mv dist/checksum_tool.exe dist/${{ matrix.asset_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
